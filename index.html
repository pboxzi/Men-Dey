<html lang="en">

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Gillian Anderson Management" />
    <meta property="og:title" content="Gillian Anderson Management" />

      property="og:description"

    />

    <meta
      property="og:image"
      content="https://www.cmagency.me/assets/images/gillian_banner_1920.jpg"
    />
    <meta property="og:image:width" content="1920" />
    <meta property="og:image:height" content="640" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:alt" content="Gillian Anderson Management" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="canonical" href="https://www.cmagency.me/" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    />

    <link rel="preconnect" href="https://wmhndjdxvxtozeyesvsy.supabase.co" />

      >
        <img
          src="/assets/images/ga_logo_horizontal_transparent.png"

        <span style="font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; color: #6e6a63">
